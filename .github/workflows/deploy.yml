# Post-merge: re-run checks, push the image to GHCR, deploy it to EC2.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Never run two deploys at once; queue the newer one instead of cancelling
# a deploy that's halfway through.
concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/roboticgen/tv-series-project-frontend

jobs:
  checks:
    uses: ./.github/workflows/_checks.yml

  build:
    name: Build and push image
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: frontend
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to EC2
    needs: build
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v5

      - name: Copy compose file to EC2
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.EC2_SSH_PORT || 22 }}
          source: deploy/docker-compose.yml
          target: tv-series-frontend
          strip_components: 1

      - name: Pull and restart
        uses: appleboy/ssh-action@v1
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE_TAG: ${{ github.sha }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.EC2_SSH_PORT || 22 }}
          envs: GHCR_USER,GHCR_TOKEN,IMAGE_TAG
          script: |
            set -eu
            cd ~/tv-series-frontend
            test -f .env || { echo "Missing ~/tv-series-frontend/.env on the server"; exit 1; }

            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            export IMAGE_TAG
            docker compose pull
            docker compose up -d --remove-orphans
            docker logout ghcr.io

            # Fail the job if the new container doesn't start serving.
            for i in $(seq 1 30); do
              if curl -fsS -o /dev/null http://127.0.0.1:3000/; then
                echo "Healthy after ${i} tries"
                docker image prune -f
                exit 0
              fi
              sleep 2
            done
            echo "App did not become healthy"; docker compose logs --tail 100
            exit 1
