services:
  postgres:
    image: postgres:16-alpine
    container_name: roboticgen_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-roboticgen}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-roboticgen}
      POSTGRES_DB: ${POSTGRES_DB:-roboticgen}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Only applied on first container start against an empty data
      # directory. After that, schema changes are migrations, not edits
      # to these files -- see database/README.md.
      - ./init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
